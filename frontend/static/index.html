<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Concierge</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --primary: #059669;
    --primary-hover: #047857;
    --primary-light: #ecfdf5;
    --accent-gradient: linear-gradient(135deg, #059669 0%, #0d9488 100%);
    --bg-surface: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-dark: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 14px -2px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 25px -5px rgba(5,150,105,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg-surface);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 1rem 1.5rem;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: 0.3px;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .header-badge {
    background: rgba(255,255,255,0.2);
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }
  .msg {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .msg.user {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg.bot .avatar {
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid #d1fae5;
  }
  .msg.user .avatar {
    background: #e2e8f0;
    color: #475569;
  }
  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    max-width: 82%;
    white-space: pre-wrap;
    line-height: 1.5rem;
    font-size: 0.95rem;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }
  .msg.bot .bubble {
    border-bottom-left-radius: 4px;
  }
  /* When reply is an A2UI card, remove bubble background chrome */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }
  .input-container {
    background: #ffffff;
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem 1.25rem 1.5rem;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.03);
  }
  .prompts-row {
    display: flex;
    gap: 0.6rem;
    padding-bottom: 0.8rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    justify-content: center;
  }
  .prompt-chip {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.95rem;
    font-size: 0.85rem;
    color: var(--text-dark);
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-weight: 500;
    box-shadow: var(--shadow-sm);
  }
  .prompt-chip:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  form {
    display: flex;
    gap: 0.6rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.98rem;
    font-family: inherit;
    background: var(--bg-surface);
    transition: all 0.2s ease;
  }
  input:focus {
    outline: none;
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(5,150,105,0.15);
  }
  button.send-btn {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  button.send-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Animated typing indicator dots */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.4rem 0.2rem;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
    transition: all 0.2s ease;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-dark); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--primary); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <span class="material-symbols-outlined" style="font-size:1.6rem; color:#fff;">restaurant</span>
    <span>Recipe Concierge</span>
  </div>
  <div class="header-badge">AI Assistant</div>
</header>

<div id="log"></div>

<div class="input-container">
  <div class="prompts-row">
    <button type="button" class="prompt-chip" onclick="sendPrompt(this.textContent)">What recipes can I make with my pantry?</button>
    <button type="button" class="prompt-chip" onclick="sendPrompt(this.textContent)">Find Mediterranean recipes & check my stock</button>
    <button type="button" class="prompt-chip" onclick="sendPrompt(this.textContent)">Generate an image of avocado toast</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask about recipes, pantry items, or meal plans…" autocomplete="off" autofocus>
    <button class="send-btn">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

window.sendPrompt = (text) => {
  input.value = text;
  if (typeof form.requestSubmit === "function") {
    form.requestSubmit();
  } else {
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  }
};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "👨‍🍳");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  if (type === "Card") {
    const node = el("div", "a2card");
    for (const k of kids()) node.appendChild(k);
    return node;
  }
  if (type === "Column") {
    const node = el("div", "a2col");
    for (const k of kids()) node.appendChild(k);
    return node;
  }
  if (type === "Row") {
    const node = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
    for (const k of kids()) node.appendChild(k);
    return node;
  }
  if (type === "Text") {
    const hint = String(props.usageHint || "body").toLowerCase();
    const tag = hint === "h1" ? "h1" : hint === "h2" ? "h2" : hint === "h3" ? "h3" : hint === "h4" ? "h4" : "p";
    const text = boundStr(props.text);
    return el(tag, "a2text a2-" + hint, text);
  }
  if (type === "Divider") return el("hr", "a2divider");
  if (type === "List") {
    const node = el("div", "a2col");
    for (const k of kids()) node.appendChild(k);
    return node;
  }
  if (type === "Image") {
    const url = boundStr(props.url);
    if (!/^https?:\/\//i.test(url)) return null;
    const img = el("img", "a2img"); img.src = url;
    return img;
  }
  if (type === "Icon") {
    const sym = iconName(boundStr(props.name));
    return el("span", "material-symbols-outlined", sym);
  }
  return null;
}

function renderA2ui(data) {
  if (!data || typeof data !== "object") return null;
  if (data.data && typeof data.data === "object") data = data.data;

  const su = data.surfaceUpdate;
  const br = data.beginRendering;
  if (!su || !su.components) return null;

  const comps = {};
  for (const c of su.components) {
    if (c && typeof c === "object" && c.id && c.component) comps[c.id] = c.component;
  }
  const rootId = (br && br.root) || (su.components[0] && su.components[0].id);
  if (!rootId) return null;

  return buildNode(rootId, comps, new Set());
}

/* ----------------------------------------------------------------------------
 * Reply rendering.
 * -------------------------------------------------------------------------- */
function renderReply(parts) {
  const b = bubble("bot");
  let renderedAnyCard = false;

  for (const p of parts || []) {
    if (p.kind === "a2ui") {
      const node = renderA2ui(p.data);
      if (node) {
        b.classList.add("rich");
        b.appendChild(node);
        renderedAnyCard = true;
        continue;
      }
    }
    const t = typeof p === "string" ? p : p.text || (p.kind === "text" && p.text);
    if (t) {
      if (renderedAnyCard) {
        const card = el("div", "a2card");
        card.appendChild(el("p", "a2text", t));
        b.appendChild(card);
      } else {
        b.appendChild(document.createTextNode(t));
      }
    }
  }
  log.scrollTop = log.scrollHeight;
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  bubble("user").textContent = text;

  const pending = bubble("bot");
  pending.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    pending.parentElement.remove(); // remove typing indicator msg
    renderReply(data.parts);
  } catch (err) {
    pending.textContent = "Error connecting to server.";
  }
};
</script>
</body>
</html>
